<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="siteHeader">
  <div style="display:flex;align-items:center;gap:12px;">
    <img id="headerLogo" src="" alt="Logo" class="header-logo" style="display:none;">
    <h1 id="shopTitle">Negozio</h1>
  </div>
  <nav>
    <a href="ini.html">⚙️ Config</a>
    <a href="cart.html" class="cart-badge">🛒 Carrello (<span id="cartCount">0</span>)</a>
  </nav>
</header>

<div class="container">

  <!-- Avviso se non configurato -->
  <div id="noConfig" class="alert alert-warning" style="display:none;margin-top:20px;">
    ⚠️ Negozio non ancora configurato.
    <a href="ini.html" style="color:inherit;font-weight:700;">Vai alla configurazione →</a>
  </div>

  <!-- Barra di ricerca -->
  <div class="search-bar" id="searchBar" style="display:none;">
    <input type="text" id="searchInput" placeholder="🔍 Cerca per marca, modello o descrizione..."
      oninput="filtraProdotti()">
  </div>

  <!-- Griglia prodotti -->
  <div id="productGrid" class="product-grid"></div>

  <!-- Nessun risultato -->
  <div id="emptyState" class="empty-state" style="display:none;">
    <h3>Nessun prodotto trovato</h3>
    <p>Prova a modificare la ricerca.</p>
  </div>

</div>

<script>
  var tuttiIProdotti = [];

  window.onload = function() {
    var configStr   = localStorage.getItem('shopConfig');
    var productsStr = localStorage.getItem('shopProducts');

    if (!configStr || !productsStr) {
      document.getElementById('noConfig').style.display = 'block';
      return;
    }

    var config = JSON.parse(configStr);
    tuttiIProdotti = JSON.parse(productsStr);

    /* Applica configurazione */
    document.title = config.name + ' — Catalogo';
    document.getElementById('shopTitle').textContent = config.name;
    document.documentElement.style.setProperty('--primary', config.color || '#2563eb');
    document.getElementById('siteHeader').style.background = config.color || '#2563eb';

    if (config.logo) {
      var logo = document.getElementById('headerLogo');
      logo.src = config.logo;
      logo.style.display = 'block';
    }

    document.getElementById('searchBar').style.display = 'flex';
    aggiornaContatore();
    mostraProdotti(tuttiIProdotti);
  };

  /* ── Render griglia ── */
  function mostraProdotti(lista) {
    var grid  = document.getElementById('productGrid');
    var empty = document.getElementById('emptyState');
    grid.innerHTML = '';

    if (lista.length === 0) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    lista.forEach(function(p) {
      var idx = tuttiIProdotti.indexOf(p);
      var card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.onclick = function() { apriProdotto(idx); };
      card.onkeydown = function(e) { if (e.key === 'Enter') apriProdotto(idx); };

      var prezzo = parseFloat(p.prezzo) || 0;
      var imgSrc = p.immagine || 'https://via.placeholder.com/400x200?text=Immagine+non+disponibile';

      card.innerHTML =
        '<img src="' + esc(imgSrc) + '" alt="' + esc(p.modello) + '" ' +
          'onerror="this.src=\'https://via.placeholder.com/400x200?text=Immagine+non+trovata\'">' +
        '<div class="card-body">' +
          '<div class="card-brand">'  + esc(p.marca)       + '</div>' +
          '<div class="card-title">'  + esc(p.modello)     + '</div>' +
          '<div class="card-desc">'   + esc(p.descrizione) + '</div>' +
          '<div class="card-price">€ ' + prezzo.toFixed(2) + '</div>' +
        '</div>';

      grid.appendChild(card);
    });
  }

  /* ── Filtro ricerca ── */
  function filtraProdotti() {
    var q = document.getElementById('searchInput').value.toLowerCase().trim();
    if (!q) { mostraProdotti(tuttiIProdotti); return; }
    var filtrati = tuttiIProdotti.filter(function(p) {
      return ((p.marca || '') + ' ' + (p.modello || '') + ' ' + (p.descrizione || ''))
        .toLowerCase().indexOf(q) >= 0;
    });
    mostraProdotti(filtrati);
  }

  /* ── Apri pagina prodotto ── */
  function apriProdotto(idx) {
    localStorage.setItem('selectedProduct', String(idx));
    window.location.href = 'product.html';
  }

  /* ── Contatore carrello ── */
  function aggiornaContatore() {
    var cart = JSON.parse(localStorage.getItem('shopCart') || '[]');
    var totale = 0;
    cart.forEach(function(item) { totale += (item.qty || 0); });
    document.getElementById('cartCount').textContent = totale;
  }

  /* ── Escape HTML ── */
  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
